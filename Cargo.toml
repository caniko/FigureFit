[package]
name = "figurefit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Scientific multi-panel figure fitting and layout solver"
repository = "https://codeberg.org/caniko/FigureFit"
keywords = ["layout", "figure", "tikz", "scientific", "typesetting"]
categories = ["science", "command-line-utilities", "visualization"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive", "env", "color"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
lopdf = "0.39"
tempfile = "3"
usvg = "0.47"

[[bin]]
name = "figurefit"
path = "src/main.rs"

[[bin]]
name = "figure-layout"
path = "src/bin/figure-layout.rs"

[lints.clippy]
clone_on_copy = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
